only_rules:
  - duplicate_imports
  - empty_count
  - trailing_whitespace
  - unused_optional_binding
excluded:
  - .build
  - Packages/RemoteCore/.build
  - build
  - iOS/build
  - iOS/build-direct
  - iOS/build-device
  - iOS/build-landing
  - iOS/build-simulator
  - macOS/build
  - macOS/build-local
reporter: xcode
